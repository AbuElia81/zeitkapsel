<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Die Zeitkapsel — Die Zeitkugel</title>
<meta name="description" content="Ein Zwiebelmodell der Zeit: vom 25.800-jährigen Yuga-Zyklus bis zum Herzschlag. Frei drehbar in alle Richtungen.">
<link rel="icon" href="bilder/icon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="bilder/icon-180.png">
<link rel="manifest" href="site.webmanifest">
<meta name="theme-color" content="#05070d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Zeitkugel">
<link rel="stylesheet" href="stil.css?v=45">
</head>
<body>

<div id="himmel"></div>
<div id="schleier"></div>

<main>
  <div id="buehne"></div>

  <div id="zeitleiste">
    <div id="zeitKopf">
      <span id="zeitAnzeige">—</span>
      <button id="jetztKnopf" title="zurück zur Gegenwart">Jetzt</button>
    </div>
    <input id="schieber" type="range" aria-label="Zeitschieber durch den Yuga-Zyklus">
    <div id="zeitSchritte">
      <button data-schritt="-1000">−1000</button>
      <button data-schritt="-100">−100</button>
      <button data-schritt="-10">−10</button>
      <button data-schritt="-1">−1</button>
      <button data-schritt="1">+1</button>
      <button data-schritt="10">+10</button>
      <button data-schritt="100">+100</button>
      <button data-schritt="1000">+1000</button>
    </div>
  </div>

  <header id="kopf">
    <h1>Die Zeitkugel</h1>
    <p>Ein Zwiebelmodell der Zyklen — von der Präzession der Erdachse bis zum Herzschlag</p>
  </header>

  <div id="linkeSpalte">
    <aside id="chronik" aria-live="polite">
      <p class="chronikKopf"><span id="epoche">—</span></p>
      <ul id="chronikListe"></ul>
    </aside>

    <aside id="tafel" class="ein"></aside>
  </div>

  <nav id="leiste" aria-label="Zeitschichten"></nav>

  <div id="pult">
    <button id="hoeher" title="eine Schicht nach außen">↑ hinaus</button>
    <button id="tiefer" title="eine Schicht nach innen">↓ eintauchen</button>
  </div>

  <p id="hinweisZeile">Ziehen dreht die Kugel · Scrollen taucht ein · ↑ ↓ blättert durch die Schichten · der Schieber oben verschiebt die Zeit</p>
</main>

<script type="module" src="kugel.js?v=45"></script>
</body>
</html>
